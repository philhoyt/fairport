name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check version strings match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          STYLE=$(sed -n 's/^Version: *//p' style.css | tr -d '\r')
          STABLE=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '\r')
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG style.css=$STYLE readme=$STABLE package.json=$PKG"
          if [ "$TAG" != "$STYLE" ] || [ "$TAG" != "$STABLE" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Version strings do not match the tag"; exit 1
          fi

      # Stage a clean copy honouring .distignore and zip the folder (never its
      # contents) so the archive has a single fairport/ root. A fixed asset name
      # keeps releases/latest/download/fairport.zip stable for the Playground
      # blueprint.
      - name: Build theme zip
        run: |
          rm -rf build && mkdir -p build/fairport
          rsync -a --exclude-from=.distignore --exclude=build ./ build/fairport/
          (cd build && zip -qr ../fairport.zip fairport)

      - name: Verify zip
        run: |
          unzip -l fairport.zip
          unzip -l fairport.zip | awk '{print $4}' | grep -E "^fairport/(style.css|theme.json|readme.txt|templates/index.html|dist/css/style.css)$" | wc -l | grep -qx 5
          ! unzip -l fairport.zip | grep -E "node_modules|/src/|/tests/|\.claude|/bin/"

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1; next} found && /^= [0-9]/{exit} found{print}" readme.txt > changelog_body.txt
          cat changelog_body.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: fairport.zip
          body_path: changelog_body.txt
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
